# 本番依存の正本はこのファイルのサービス別 group と uv.lock。
# 各サービスの requirements.txt は Cloud Run functions の buildpacks 用に、以下で生成する（手で編集しない）:
#   uv export --frozen --only-group <service> --no-hashes --no-emit-project > <service>/requirements.txt
# -o ではなく標準出力を書き出すのは、ヘッダの生成コマンドを同期テストの再実行と一致させるため。
# 生成結果がずれないことは各サービスの tests/test_requirements_sync.py が確かめる。
[project]
name = "monologue-muser-dev"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
upload-monologue = [
    "functions-framework>=3.10",
    "google-cloud-storage>=3",
    "flask>=3.1.3",
]
summarize-monologue = [
    "functions-framework>=3.10",
    "google-cloud-storage>=3",
    "google-cloud-firestore>=2.13",
    "google-genai>=2.8",
    "requests>=2.33",
    "pydantic>=2.5",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    # テストは本番と同じライブラリを import するため、開発側にも両サービス分を入れる
    { include-group = "upload-monologue" },
    { include-group = "summarize-monologue" },
]

[tool.pytest.ini_options]
# 2サービスとも main.py を持ちモジュール名が衝突するため、
# pytest はサービス単位で実行する: uv run pytest upload-monologue / summarize-monologue
testpaths = ["upload-monologue/tests", "summarize-monologue/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# private/ は作業場（非公開 repo）にだけある個人用の置き場で、試作スクリプトを含むため lint しない
extend-exclude = ["private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
